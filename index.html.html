<style>
:root{--bg:#0b0c0e;--s:#15171a;--s2:#1d2024;--b:#2b2f35;--t:#eceae4;--m:#8f959e;--a:#86bfcc;--w:#e9b872;--ok:#6cc79a;--bad:#e8685d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.btn.p{background:var(--a);color:#0b0c0e;border-color:var(--a);font-weight:600}.btn.sm{padding:4px 9px;font-size:13px}.btn[disabled]{opacity:.5;cursor:wait}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--b);margin:18px 0}.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--m);padding:8px 12px;font:inherit;cursor:pointer}.tabs button.on{color:var(--t);border-color:var(--a)}
.sec:not(.on){display:none}
.shot{background:var(--s);border:1px solid var(--b);border-left:3px solid var(--a);border-radius:12px;padding:14px;margin-bottom:12px}.shot.done{opacity:.55;border-left-color:var(--ok)}
.sh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.sh .ti{flex:1;min-width:140px;font:22px 'Instrument Serif',serif}

.ok{color:var(--ok)}.bad{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--a);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}#toast.on{opacity:1}
.price{font:44px 'Instrument Serif',serif}ul.f2{padding-left:18px;margin:10px 0;color:var(--m)}
body{font-size:16px;-webkit-font-smoothing:antialiased;background:radial-gradient(1100px 560px at 75% -10%,#1a2a31 0,transparent 60%),radial-gradient(800px 480px at -10% 8%,#2a2218 0,transparent 55%),var(--bg);background-attachment:fixed}
h1{font-size:clamp(42px,8.4vw,88px);letter-spacing:-.028em;line-height:1.01}h2{letter-spacing:-.012em;font-size:clamp(30px,4.6vw,44px)}
.w{max-width:1120px;padding:32px 24px 88px}
nav{padding:12px 24px;gap:4px;overflow-x:auto;white-space:nowrap}nav .br{display:flex;align-items:center;gap:10px;font-size:25px}nav a{font-weight:500;font-size:14px}

.btn{min-height:40px;border-radius:10px;font-weight:500;transition:border-color .15s,transform .15s}.btn:active{transform:scale(.98)}.btn.p{box-shadow:0 10px 26px -12px var(--a)}.btn.lg{min-height:50px;padding:0 28px;font-size:16px}
input,select,textarea{border-radius:10px;background:#0e0f11;padding:11px 13px;transition:border-color .15s}input:focus,select:focus,textarea:focus{border-color:var(--a)}
.hero{padding:56px 0 36px}.hero h1{max-width:14ch}.hero p{font-size:19px;max-width:540px}

.sg{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;margin-top:18px}.st textarea{min-height:130px;font-size:17px}.side{position:sticky;top:76px}
.fm{margin-top:20px;gap:18px}.full{grid-column:1/-1}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{min-height:42px;padding:0 16px;background:#0e0f11;color:var(--m);border:1px solid var(--b);border-radius:99px;font:inherit;cursor:pointer}.seg button.on{color:#0b0c0e;background:var(--a);border-color:var(--a);font-weight:600}.seg button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.fr{display:flex;justify-content:center;align-items:center;padding:16px;margin:12px 0;height:182px;background:#0e0f11;border:1px solid var(--b);border-radius:12px}.fr div{border:1.5px solid var(--a);border-radius:6px;display:grid;place-items:center;color:var(--a);font-size:13px;background:rgba(134,191,204,.06)}.fr div.tall{height:150px}.fr div:not(.tall){width:100%}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--b);color:var(--m)}.kv b{color:var(--t);font-weight:500}
.shot{border-radius:16px;padding:18px 18px 18px 22px;border-left-color:var(--b);border-left-width:1px;position:relative;background:linear-gradient(180deg,#171a1d,#131518)}.shot::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:var(--a)}.shot.done::before{background:var(--ok)}
.sh b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--a);font-size:13px}.sh .ti{font-size:26px}
.f small{display:block;margin-bottom:3px}.f div[contenteditable]{background:#0e0f11;line-height:1.5}
.tabs{gap:2px;overflow-x:auto}.tabs button{white-space:nowrap;font-weight:500;min-height:44px}
@media(max-width:760px){.w{padding:20px 16px 72px}.hero{padding:32px 0 24px}.hero p{font-size:17px}.sg{grid-template-columns:1fr}.side{position:static}nav{padding:10px 14px}nav a{padding:6px 8px}.sh{gap:8px}.sh .ti{flex-basis:calc(100% - 110px)}.sh .row{width:100%}.fs{grid-template-columns:1fr}.btn.sm{min-height:42px}#go{width:100%}.vf .strip{height:64px}.card{padding:18px}}
.intro{padding:44px 0 22px}.intro h1{font-size:clamp(36px,6.4vw,64px);max-width:16ch}.intro p{font-size:18px;max-width:520px;margin-top:14px}
.ideaw{padding:22px}.ideaw textarea{min-height:170px;font-size:19px;line-height:1.5;border-radius:14px;padding:16px 18px}.ideaw h3{margin:26px 0 4px}
.pill{position:relative;display:inline-flex;align-items:center;min-height:42px;padding:0 16px;background:#0e0f11;color:var(--m);border:1px solid var(--b);border-radius:99px;cursor:pointer}.pill input{position:absolute;opacity:0;width:1px;height:1px}.pill:has(input:checked){color:#0b0c0e;background:var(--a);border-color:var(--a);font-weight:600}.pill:has(input:focus-visible){outline:2px solid var(--a);outline-offset:2px}
.seg button[data-a=insp]{color:var(--t)}.seg button[data-a=insp]:hover{border-color:var(--a)}
.adv summary{cursor:pointer;color:var(--m);padding:6px 0;font-weight:500}.adv[open] summary{color:var(--t)}
.dc{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--m);font-size:14px}.dc input{width:110px}
@media(max-width:760px){.ideaw .btn.lg{width:100%}.ideaw{padding:16px}.ideaw textarea{font-size:17px}}
.empty{text-align:center;padding:72px 16px;max-width:520px;margin:auto}.empty p{margin:14px 0 26px;font-size:17px}
.cf{margin-top:14px;padding:12px;border:1px solid var(--bad);border-radius:12px;background:#1a1213}.cf p{color:var(--t);margin:0 0 10px}.btn.danger{background:var(--bad);border-color:var(--bad);color:#0b0c0e;font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{nav,.noprint,.tabs,.btn{display:none!important}body{background:#fff;color:#000}.card,.shot{background:#fff;border-color:#bbb;color:#000}.sec,.sec:not(.on){display:block!important}.f div[contenteditable]{background:#fff}.tc,p,.f small{color:#444}}

<script>
const PLANS=[
{id:'free',name:'Free',price:0,gens:3,feat:['3 plans per month','Editable shot lists','Print your plan']},
{id:'creator',name:'Creator',price:29,gens:30,feat:['30 plans per month','Export and copy plans','Regenerate any shot']},
{id:'pro',name:'Pro',price:59,gens:150,feat:['Higher monthly limit (placeholder: 150)','Advanced features (to be defined)','Priority generation']}];
const CUR='AED';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=new Date().toISOString().slice(0,7);
let S={projects:[],used:0,month:mk},curId=null,tab='shots',delArm=null,busy=false,draft=null;
const USER='local';/* replace with the signed-in user id once accounts exist */
const Store={key:u=>u==='local'?'slai':'slai:'+u,
 load(u){try{const r=localStorage.getItem(this.key(u));if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.projects))return d}}catch(e){}return null},
 save(u,d){try{localStorage.setItem(this.key(u),JSON.stringify(d))}catch(e){}}};
{const d=Store.load(USER);if(d)S=Object.assign(S,d)}
if(S.month!==mk){S.month=mk;S.used=0}
S.v=1;
const save=()=>Store.save(USER,S);
const P=()=>S.projects.find(p=>p.id===curId);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)}

/* ---------- Simulated generator (template-based; swap for server AI call) ---------- */
const R=[
{k:'Establishing wide',t:'Wide',f:'Wide, {s} in the lower third with space ahead',m:'Locked-off, no movement',a:'The scene settles around {s}: ambient motion crosses behind while {s} holds still, setting place and mood.',l:'Use available light; expose for the highlight you want to keep.',e:'Fade in from black over about 10 frames and hold the first beat.'},
{k:'Low-angle detail',t:'Close-up',f:'Low angle, tight on the most distinctive feature of {s}',m:'Slow push-in',a:'The camera drops near the ground and creeps toward the key detail of {s}, with foreground blur leading the eye.',l:'Side-light to carve out shape and texture.',e:'Cut on a sound accent and keep it under 5 seconds.'},
{k:'Parallel track',t:'Medium',f:'Side profile, {s} centered',m:'Lateral track matching the speed of {s}',a:'The camera travels alongside {s} at matching speed, so the background streaks while {s} stays crisp.',l:'Rim or back light separates {s} from the background.',e:'Light speed ramp, or match-cut the move into the next shot.'},
{k:'Texture insert',t:'Macro insert',f:'Extreme close-up, shallow depth of field',m:'Static with subtle drift',a:'A tiny tactile detail of {s} fills the frame while light glints across its surface.',l:'One soft source; flag spill with a dark card.',e:'Use as a cutaway to hide a jump or reset the rhythm.'},
{k:'Point of view',t:'POV',f:'Eye level, from the point of view of {s}',m:'Steady forward move',a:'The viewer sees what {s} sees, moving through the space toward the next point of interest.',l:'Keep practical lights in frame for depth and motion cues.',e:'Cut in on motion so the movement carries across the edit.'},
{k:'Foreground layers',t:'Wide',f:'Framed through foreground elements (railing, glass, foliage)',m:'Slow pan',a:'Foreground elements slide past the lens, revealing {s} behind them in layers.',l:'Keep the foreground darker than {s} to guide the eye.',e:'Use the foreground wipe as a natural transition.'},
{k:'Hero reveal',t:'Medium wide',f:'Centered, symmetrical, slightly low',m:'Slow dolly-out or tilt-up',a:'{s} is fully revealed, clean and intentional, with nothing competing for attention.',l:'Your best light of the shoot: key slightly off-axis, soft fill.',e:'Land the music peak here; make it the longest shot after the opener.'},
{k:'Closing pull-back',t:'Wide',f:'Wide, {s} shrinking into the environment',m:'Slow pull-back or static hold',a:'The camera releases {s} back into the scene, echoing the opening shot.',l:'Match the opening exposure so the ending rhymes.',e:'Hold one second past the action, then fade to black with the music tail.'}];
const E={
'Smartphone, handheld':{s:'4K 24fps, lock exposure and focus, hold the phone with both hands and keep elbows tucked.',tips:['Brace against a wall, railing or your body to reduce shake.','Move slowly and keep the phone level; fast moves look shaky.','Shoot the same move twice and keep the steadier take.','Turn on grid lines to keep horizons level.']},
'Smartphone + tripod':{s:'4K 24fps, lock exposure and focus (long-press), exposure −0.7, stay on the 1× or 2× lens, no digital zoom.',tips:['Lock the tripod head, then trigger with the timer or an earbud remote to avoid shake.','Use the main 1× lens for the cleanest low-light image and wipe it first.','For motion, shoot the move as two takes: subject entering, then leaving.','Long-press to lock focus on the subject, then drag exposure down a little.']},
'Smartphone + gimbal':{s:'4K 24fps, gimbal in follow mode, lock exposure and focus, add an ND filter in daylight.',tips:['Balance the gimbal with the phone in its case before the first take.','Walk heel-to-toe with bent knees; take every move twice.','Use lock mode for the static beats so the horizon never drifts.','Start recording before you start moving so you have clean handles.']},
'Mirrorless / DSLR + tripod':{s:'4K 24fps, shutter 1/50, lowest ISO the light allows, f/2.8–4, manual white balance.',tips:['Shoot a flat-ish profile if you will grade; expose for the highlights.','Focus manually with peaking and punch-in on critical shots.','Use a fluid head for smooth pans; counterbalance the camera.','Keep a lens cloth handy; flares and dust show up at wide apertures.']},
'Drone':{s:'4K 24/30fps, shutter 1/50 with ND in daylight, home point set, return-to-home height checked.',tips:['Fly a rehearsal pass at low speed before recording the real take.','Keep the subject inside visual line of sight at all times.','Use slow, single-axis moves; combined moves look jittery.','Check battery reserve before every pass; land at 30%.']},
'Action camera':{s:'4K 30/60fps, linear lens mode, stabilization on, ND filter in daylight.',tips:['Mount it at a deliberate angle and check the horizon on the screen.','Use linear mode to avoid the fisheye look on fast motion.','Shoot 60fps on moves so you can slow them down in the edit.','Check the mount twice; vibration unscrews things.']}};
const L={Cinematic:'Favor warm practicals against cool ambient light; keep contrast gentle.',Moody:'Underexpose slightly and let shadows fall to black; one hard source only.',Bright:'Shoot with soft, even daylight; avoid harsh midday sun.',Minimal:'Use one clean, soft source and plain surroundings.'};
const MU={Cinematic:'Slow-build ambient synth, 70–90 BPM, with a low hit on the hero reveal.',Moody:'Dark minimal electronica or sparse piano; leave silence before the peak.',Bright:'Upbeat acoustic or light percussion, 100–120 BPM; cut on the beats.',Minimal:'Quiet ambient texture with sparse clicks; let the picture lead.'};
function mkShot(ri,p,dur){const r=R[ri],q=p.input.eqs||[p.input.eq],e=E[q[ri%q.length]]||E[Object.keys(E)[0]],s=p.subj,rp=x=>x.replace(/\{s\}/g,s);
 return{id:uid(),ri,title:r.k,type:r.t,frame:rp(r.f),move:r.m,act:rp(r.a),light:r.l.replace(/\{s\}/g,s)+' '+L[p.input.style],tip:(q.length>1?q[ri%q.length]+': ':'')+e.tips[ri%4],edit:r.e,dur,done:false}}
function gen(i){
 const n=Math.max(3,Math.min(8,Math.round(i.dur/5)));
 const m=i.idea.match(/\b(?:my|our)\s+([a-z0-9 -]{2,24}?)(?=\s+(?:driving|at|in|on|through|walking|with|using|while|for|during|and)\b|[,.]|$)/i);
 const subj=m?m[1].trim():'the subject';
 let d=Array(n).fill(Math.floor(i.dur/n)),r=i.dur-d.reduce((a,b)=>a+b,0);
 for(let k=0;r>0;k=(k+1)%n,r--)d[n-1-k]++;
 for(let k=0;k+1<n;k+=2)if(d[k+1]>2){d[k]++;d[k+1]--}
 const p={id:uid(),ownerId:USER,subj,input:i,created:Date.now(),sim:true};
 const bs=m?subj:i.idea.split(/\s+/).slice(0,5).join(' ').replace(/[.,;:!?]+$/,'');p.title=bs.charAt(0).toUpperCase()+bs.slice(1)+': '+({Cinematic:'the cinematic cut',Moody:'after dark',Bright:'daylight reel',Minimal:'clean frame'})[i.style];
 p.concept=`A ${i.style.toLowerCase()} ${i.dur}-second ${i.dialogue?'piece with spoken lines':'visual-only piece'} for ${i.platform} in ${i.aspect}, shot on ${i.eq.toLowerCase()}. Brief: ${i.idea}${i.loc?` Location: ${i.loc}.`:''}${i.notes?` Notes: ${i.notes}`:''}`;
 p.shots=d.map((x,k)=>mkShot(n===1?0:Math.round(k*7/(n-1)),p,x));
 const t=(i.idea+' '+i.eq+' '+(i.loc||'')+' '+(i.notes||'')).toLowerCase();
 p.safety=['Scout the location in daylight and tell someone where you are filming.','Check whether the location needs a filming permit before you set up.'];
 if(/driv|car|road|bmw|drift|street/.test(t))p.safety.push('Driving: never operate the camera while driving. Use a second person or a secured mount, stay within speed limits, and film moving-vehicle shots only on safe, legal roads or closed locations.');
 if(/drone/.test(t))p.safety.push('Drone: check current UAE drone rules, registration and permits first; keep line of sight, stay away from people, roads, airports and other no-fly zones.');
 if(/airport|palace|government|military|police|bridge|metro|port|embassy|school/.test(t))p.safety.push('Your idea mentions a sensitive or restricted location. Get written permission before filming there.');
 if(/roof|cliff|edge|water|sea|beach|climb|height/.test(t))p.safety.push('Hazardous location: keep a safe distance from edges and water, and never risk a shot for safety.');
 const eqs=i.eqs||[i.eq],eq=E[eqs[0]]||E[Object.keys(E)[0]];
 p.check=['Charge all batteries and bring a spare','Free up storage and format the card','Clean the lens right before shooting',...eqs.map(n=>`Camera settings, ${n}: ${(E[n]||eq).s}`),eqs.some(x=>/tripod/i.test(x))?'Tripod legs locked and weighted':'Mount or stabilizer checked',`Frame for ${i.aspect} and keep ${i.platform} safe zones clear of key action`,'Check weather and sunset time for your shoot window',i.dialogue?'Lavalier or shotgun mic ready; record a room-tone minute':'Record 30 seconds of clean ambient sound anyway','Review safety notes and permits','Back up footage the same day',...(i.loc?[`Confirm access, permissions and opening hours for ${i.loc}`]:[]),...(i.exp==='Beginner'?['Shoot every shot twice so you have a safe backup take']:[])].map(x=>({t:x,done:false}));
 p.sound=[['Music',MU[i.style]],['Ambient bed','Layer location ambience under the music so cuts feel grounded.'],['Transitions','Use short risers or whooshes only on the 2 to 3 strongest cuts.'],['Mix',i.dialogue?'Duck music under dialogue by 10 to 12 dB.':'Music leads; leave 1 second of near-silence before the hero reveal.']];
 return p}
const total=p=>p.shots.reduce((a,s)=>a+(+s.dur||0),0);
function fix(p){let diff=p.input.dur-total(p),g=0;while(diff!==0&&g++<500){const sg=Math.sign(diff);const sorted=[...p.shots].sort((a,b)=>sg>0?a.dur-b.dur:b.dur-a.dur);const s=sorted.find(x=>sg>0||x.dur>1);if(!s)break;s.dur+=sg;diff-=sg}}
function asText(p){let t=`${p.title}\n${p.concept}\n\nSHOT LIST (${fmt(total(p))})\n`;let c=0;p.shots.forEach((s,i)=>{t+=`\n${i+1}. ${s.title} [${fmt(c)}–${fmt(c+s.dur)}, ${s.dur}s]\n Type: ${s.type} | ${s.frame}\n Move: ${s.move}\n Action: ${s.act}\n Light: ${s.light}\n Tip: ${s.tip}\n Edit: ${s.edit}\n`;c+=s.dur});t+='\nCHECKLIST\n'+p.check.map(x=>`[${x.done?'x':' '}] ${x.t}`).join('\n')+'\n\nSAFETY\n'+p.safety.map(x=>'- '+x).join('\n')+'\n\nSOUND\n'+p.sound.map(x=>`- ${x[0]}: ${x[1]}`).join('\n');return t}

const SAMPLE=[{dur:5,title:'Establishing wide',type:'Wide'},{dur:4,title:'Low-angle detail',type:'Close-up'},{dur:6,title:'Parallel track',type:'Medium'},{dur:4,title:'Texture insert',type:'Macro'},{dur:5,title:'Hero reveal',type:'Medium wide'},{dur:6,title:'Closing pull-back',type:'Wide'}];
function home(){return `<section class="hero"><h1>Turn a video idea into a plan you can shoot tomorrow.</h1>

const LANG='en',I18N={en:{title:'What are we creating today?',sub:'From the first idea to the final frame. Plan your next video with confidence.',ph:'Describe your vision, story, or concept...',gen:'Generate Shot List',insp:'Need inspiration?',hint:'Choose a starting point to fill the idea box, then change it however you like, or ignore these entirely.'}},t=k=>(I18N[LANG]&&I18N[LANG][k])||I18N.en[k];
const INSP=[{k:'Travel & Adventure',p:'A 60-second travel film about arriving in a new city at dawn: quiet streets, local food, a moment of getting lost and a final wide view that shows why the trip was worth it. Documentary feel, natural light, no voiceover.'},{k:'Product & Brand',p:'A 30-second launch video for a handmade ceramic coffee mug: close textures, steam rising, hands lifting the mug, and a clean hero shot on a neutral background. Calm, premium and tactile.'},{k:'Lifestyle',p:'A 45-second morning-routine video that follows someone from waking up to leaving the house: soft window light, small rituals, relaxed pacing and a warm, unhurried mood.'},{k:'Short Film',p:'A 90-second short film about two strangers who exchange a single look on a late-night train. Minimal dialogue, controlled lighting and a quiet ending that leaves the story open.'},{k:'Social Content',p:'A 15-second vertical video with a strong hook in the first two seconds: a quick tip, three punchy visual beats and a clear final frame that invites viewers to follow.'},{k:'Music Video',p:'A 60-second performance-led music video for a mellow acoustic track: the artist in a lived-in room, intercut with close-ups of hands, instruments and shifting light as the song builds.'}];
const pills=(k,a,v,f)=>`<input type="hidden" id="${k}" value="${v}"><div class="seg" role="group">${a.map(x=>`<button type="button" class="${String(x)===String(v)?'on':''}" data-a="pick" data-k="${k}" data-v="${x}">${f?f(x):x}</button>`).join('')}</div>`;
const side=d=>{const n=Math.max(3,Math.min(8,Math.round(d.dur/5))),[w,h]=d.aspect.split(':');return `<aside class="card side"><h3>Frame preview</h3><div class="fr"><div style="aspect-ratio:${w}/${h}" class="${+w<=+h?'tall':''}"><span>${d.aspect}</span></div></div><div class="kv"><span>Runtime</span><b>${d.dur}s</b></div><div class="kv"><span>Shots</span><b>about ${n}</b></div><div class="kv"><span>Average shot</span><b>${(d.dur/n).toFixed(1)}s</b></div></aside>`};
function studio(){const d=draft||{idea:'',dur:30,aspect:'9:16',style:'Cinematic',eqs:['Smartphone, handheld'],platform:'Short-form social',dialogue:false,exp:'Beginner',loc:'',notes:''};
 const o=(a,v)=>a.map(x=>`<option${String(x)===String(v)?' selected':''}>${x}</option>`).join('');const lim=PLANS[0].gens;
 return `<div class="intro"><h1>${t('title')}</h1><p>${t('sub')}</p></div>
<div class="ideaw card"><label class="lbl" for="idea">Your idea</label><textarea id="idea" placeholder="${t('ph')}">${esc(d.idea)}</textarea><div class="row" style="margin-top:14px"><button class="btn p lg" data-a="gen"${busy?' disabled':''}>${busy?'Building plan…':t('gen')}</button></div><h3>${t('insp')}</h3><p>${t('hint')}</p><div class="seg">${INSP.map((x,i)=>`<button type="button" data-a="insp" data-i="${i}">${x.k}</button>`).join('')}</div></div>
<div class="sg"><div class="card st"><h3>Creation settings</h3>
<div class="grid g3 fm">
<div class="full"><span class="lbl">Duration</span>${pills('dur',[15,30,60,90,120],d.dur,v=>v+'s')}<label class="dc">Custom, 5 to 180 seconds<input type="number" id="durc" min="5" max="180" inputmode="numeric" value="${[15,30,60,90,120].includes(d.dur)?'':d.dur}"></label></div>
<div class="full"><span class="lbl">Aspect ratio</span>${pills('aspect',['9:16','16:9','1:1','4:5'],d.aspect)}</div>
<div class="full"><span class="lbl">Visual style</span>${pills('style',Object.keys(L),d.style)}</div>
<div class="full"><span class="lbl">Equipment (choose everything you have)</span><div class="seg">${Object.keys(E).map(k=>`<label class="pill"><input type="checkbox" class="eqc" value="${k}"${d.eqs.includes(k)?' checked':''}>${k}</label>`).join('')}</div></div>
<div class="full"><span class="lbl">Dialogue</span>${pills('dlg',['0','1'],d.dialogue?'1':'0',v=>v==='1'?'Include dialogue':'No dialogue')}</div><details class="adv full"${d.adv?' open':''}><summary>More options</summary><div class="grid g3 fm" style="margin-top:14px"><div><label class="lbl" for="platform">Target platform</label><select id="platform">${o(['Short-form social','Long-form online video','Website or ad','Film or festival','Event or presentation','Not decided'],d.platform)}</select></div>
<div><label class="lbl" for="exp">Experience level</label><select id="exp">${o(['Beginner','Intermediate','Advanced'],d.exp)}</select></div>
<div><label class="lbl" for="loc">Location (optional)</label><input id="loc" value="${esc(d.loc)}" placeholder="City, venue or type of place"></div><div class="full"><label class="lbl" for="notes">Extra creative instructions (optional)</label><textarea id="notes" style="min-height:80px">${esc(d.notes)}</textarea></div></div></details></div>
<div class="row" style="margin-top:18px"><button class="btn p lg" id="go" data-a="gen"${busy?' disabled':''}>${busy?'Building plan…':t('gen')}</button><span class="chip">${Math.max(0,lim-S.used)} of ${lim} free plans left this month</span></div></div>
${side(d)}</div><div class="note">Simulated generation: plans are built from templates in your browser, not by an AI model. The monthly counter is stored in this browser only; real limits need a server.</div>
<div class="card"><h3>What works today</h3><ul class="f2"><li>Working: editing, reordering, adding, removing, regenerating shots, checklists, saving to this browser, print and copy.</li><li>Simulated: the generation itself and the usage counter.</li><li>Needs a backend: real AI generation with validated JSON, accounts, billing, cross-device sync.</li></ul></div>`}
function shotCard(p,s,i,c){return `<div class="shot${s.done?' done':''}" data-id="${s.id}"><div class="sh"><input type="checkbox" aria-label="Mark shot ${i+1} filmed" data-c="done" ${s.done?'checked':''}><b>${i+1}</b>
<div class="ti" contenteditable data-f="title" role="textbox" aria-label="Shot title">${esc(s.title)}</div><span class="tc">${fmt(c)}–${fmt(c+s.dur)}</span>
<label class="lbl" style="margin:0">Seconds <input type="number" min="1" max="120" value="${s.dur}" data-c="dur" aria-label="Duration in seconds"></label>
<span class="row noprint" style="gap:4px"><button class="btn sm" data-a="up" aria-label="Move up">↑</button><button class="btn sm" data-a="dn" aria-label="Move down">↓</button><button class="btn sm" data-a="rg">Regenerate</button><button class="btn sm" data-a="rm">Remove</button></span></div>
<div class="fs">${[['Shot type','type'],['Framing','frame'],['Camera movement','move'],['Action','act'],['Lighting','light'],['Equipment tip','tip'],['Editing note','edit']].map(f=>`<div class="f"><small>${esc(f[0])}</small><div contenteditable data-f="${f[1]}" role="textbox">${esc(s[f[1]])}</div></div>`).join('')}</div></div>`}
function project(){const p=P();if(!p)return `<h2>No project open</h2><p>Open one from your projects or create a new plan.</p><a class="btn p" href="#studio">Plan a video</a>`;
 const tt=total(p),ok=tt===p.input.dur;let c=0;
 const T=(n,l)=>`<button class="${tab===n?'on':''}" data-a="tab" data-t="${n}">${l}</button>`;
 return `<div class="row" style="justify-content:space-between;align-items:flex-start"><div style="flex:1;min-width:240px"><h1 style="font-size:clamp(30px,5vw,48px)" contenteditable data-f="ptitle" role="textbox" aria-label="Project title">${esc(p.title)}</h1><p style="margin-top:10px">${esc(p.concept)}</p></div>
<div class="row noprint"><button class="btn" data-a="print">Print / save PDF</button><button class="btn" data-a="copy">Copy as text</button></div></div>
<div class="row"><span class="chip">${p.input.dur}s · ${esc(p.input.aspect)} · ${esc(p.input.platform)}</span><span class="chip">${esc(p.input.eq)}</span><span class="chip ${ok?'ok':'bad'}">${ok?'Durations match runtime':`Shots total ${tt}s, runtime ${p.input.dur}s`}</span>${ok?'':'<button class="btn sm noprint" data-a="fix">Fix to runtime</button>'}</div>
${p.sim?'<div class="note">Simulated plan: generated from templates in your browser, not by an AI model. Everything is editable.</div>':''}
${strip(p.shots)}
<div class="tabs">${T('shots','Shot list')}${T('check','Checklist')}${T('edit','Edit timeline')}${T('notes','Safety and sound')}</div>
<section class="sec${tab==='shots'?' on':''}">${p.shots.map((s,i)=>{const h=shotCard(p,s,i,c);c+=s.dur;return h}).join('')}<button class="btn noprint" data-a="add">Add shot</button></section>
<section class="sec${tab==='check'?' on':''}"><h3 style="margin:10px 0">Filming checklist</h3>${p.check.map((x,i)=>`<label class="ck${x.done?' done':''}"><input type="checkbox" data-c="ck" data-i="${i}" ${x.done?'checked':''}><span>${esc(x.t)}</span></label>`).join('')}</section>
<section class="sec${tab==='edit'?' on':''}"><h3 style="margin:10px 0">Editing timeline</h3>${(()=>{let t=0;return p.shots.map((s,i)=>{const h=`<div class="tl"><span class="tc">${fmt(t)}–${fmt(t+s.dur)}</span><div><b>${i+1}. ${esc(s.title)}</b><br><span style="color:var(--m)">${esc(s.edit)}</span></div></div>`;t+=s.dur;return h}).join('')})()}</section>
<section class="sec${tab==='notes'?' on':''}"><h3 style="margin:10px 0">Safety considerations</h3><ul class="f2">${p.safety.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3 style="margin:18px 0 6px">Music and sound design</h3>${p.sound.map(x=>`<div class="tl"><b>${esc(x[0])}</b><span style="color:var(--m)">${esc(x[1])}</span></div>`).join('')}</section>`}
function projects(){if(!S.projects.length)return `<div class="empty"><h2>Your creative journey starts here.</h2><p>Projects you generate appear here and are saved in this browser. Nothing is created until you make it.</p><a class="btn p lg" href="#studio">Create your first project</a></div>`;

function pricing(){return `<h2>Plans</h2><p>Prices are provisional and set in one config list in the code.</p><div class="grid g3">${PLANS.map(p=>`<div class="card${p.id==='creator'?' feat':''}"><h3>${p.name}</h3><div class="price">${p.price?CUR+' '+p.price:'Free'}</div><p>${p.price?'per month':'no card needed'}</p><ul class="f2">${p.feat.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>${p.id==='free'?'<a class="btn p" href="#studio">Start planning</a>':`<button class="btn" data-a="buy">Notify me</button>`}</div>`).join('')}</div>

const V={home,studio,project,projects,pricing};
function render(keep){const h=(location.hash||'#home').slice(1);const k=V[h]?h:'home';$('#v').innerHTML=V[k]();document.querySelectorAll('nav a[data-n]').forEach(a=>a.classList.toggle('on',a.dataset.n===k));if(!keep)window.scrollTo(0,0)}
addEventListener('hashchange',()=>render());

/* ---------- Actions ---------- */
const go=h=>{location.hash=h};
function readForm(){const c=+$('#durc').value,eqs=[...document.querySelectorAll('.eqc:checked')].map(x=>x.value);return{idea:$('#idea').value.trim(),dur:c>=5&&c<=180?Math.round(c):+$('#dur').value,aspect:$('#aspect').value,style:$('#style').value,eqs,eq:eqs.join(', '),platform:$('#platform').value,exp:$('#exp').value,dialogue:$('#dlg').value==='1',loc:$('#loc').value.trim(),notes:$('#notes').value.trim(),adv:$('.adv').open}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.a,card=b.closest('[data-id]'),id=card&&card.dataset.id,p=P();
 if(a==='gen'){const i=readForm();draft=i;if(i.idea.length<10){toast('Describe your idea in a sentence or two first.');$('#idea').focus();return}if(!i.eqs.length){toast('Select at least one piece of equipment.');return}
  if(S.used>=PLANS[0].gens){toast('You have used all 3 free plans this month. Paid plans are not available yet.');return}
  busy=true;render(1);setTimeout(()=>{const np=gen(i);S.projects.push(np);S.used++;save();busy=false;curId=np.id;tab='shots';go('project');render()},900)}
 else if(a==='tab'){tab=b.dataset.t;render(1)}
 else if(a==='open'){curId=id;tab='shots';go('project')}
 else if(a==='dup'){const o=S.projects.find(x=>x.id===id),c=JSON.parse(JSON.stringify(o));c.id=uid();c.title=o.title+' (copy)';c.created=Date.now();c.shots.forEach(s=>s.id=uid());S.projects.push(c);save();render(1);toast('Project duplicated.')}
 else if(a==='del'){delArm=id;render(1)}
 else if(a==='delno'){delArm=null;render(1)}
 else if(a==='delyes'){S.projects=S.projects.filter(x=>x.id!==id);if(curId===id)curId=null;delArm=null;save();render(1);toast('Project deleted.')}
 else if(a==='pick'){const k=b.dataset.k,v=b.dataset.v;draft=readForm();if(k==='dlg')draft.dialogue=v==='1';else draft[k]=k==='dur'?+v:v;render(1)}
 else if(a==='insp'){draft=readForm();draft.idea=INSP[+b.dataset.i].p;render(1);const x=$('#idea');x.focus();x.setSelectionRange(x.value.length,x.value.length)}
 else if(a==='buy')toast('Billing isn’t set up yet. No payment was taken.');
 else if(p){const i=p.shots.findIndex(s=>s.id===id),s=p.shots[i];
  if(a==='up'&&i>0)[p.shots[i-1],p.shots[i]]=[p.shots[i],p.shots[i-1]];
  else if(a==='dn'&&i<p.shots.length-1)[p.shots[i+1],p.shots[i]]=[p.shots[i],p.shots[i+1]];
  else if(a==='rm'){if(p.shots.length<2){toast('A plan needs at least one shot.');return}p.shots.splice(i,1)}
  else if(a==='rg'){const used=p.shots.map(x=>x.ri),free=R.map((_,k)=>k).filter(k=>!used.includes(k)),pool=free.length?free:R.map((_,k)=>k).filter(k=>k!==s.ri);const n=mkShot(pool[Math.floor(Math.random()*pool.length)],p,s.dur);n.id=s.id;p.shots[i]=n;toast('Shot regenerated (simulated).')}
  else if(a==='add'){const used=p.shots.map(x=>x.ri),free=R.map((_,k)=>k).filter(k=>!used.includes(k));p.shots.push(mkShot(free.length?free[0]:Math.floor(Math.random()*8),p,3))}

  else if(a==='copy'){const t=asText(p);const fb=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('Plan copied.')}catch(e){toast('Copy was blocked by the browser.')}x.remove()};try{navigator.clipboard.writeText(t).then(()=>toast('Plan copied.'),fb)}catch(e){fb()}return}
  save();render(1)}});
document.addEventListener('change',e=>{const el=e.target,c=el.dataset.c;if(!c)return;const p=P(),card=el.closest('[data-id]'),id=card&&card.dataset.id;
 if(c==='rn'){const x=S.projects.find(q=>q.id===id);x.title=el.value.trim()||x.title;save();toast('Renamed.');return}
 if(!p)return;
 if(c==='ck'){p.check[+el.dataset.i].done=el.checked}
 else{const s=p.shots.find(x=>x.id===id);if(c==='done')s.done=el.checked;if(c==='dur')s.dur=Math.max(1,Math.min(120,Math.round(+el.value)||1))}
 save();render(1)});
document.addEventListener('focusout',e=>{const el=e.target;if(!el.dataset||!el.dataset.f)return;const p=P();if(!p)return;const v=el.innerText.trim();
 if(el.dataset.f==='ptitle'){p.title=v||p.title}else{const s=p.shots.find(x=>x.id===el.closest('[data-id]').dataset.id);if(s)s[el.dataset.f]=v}save()});
render();
