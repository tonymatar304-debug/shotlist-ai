<script>

{const d=Store.load(USER);if(d)S=Object.assign(S,d)}
if(S.month!==mk){S.month=mk;S.used=0}

/* ---------- Simulated generator (template-based; swap for server AI call) ---------- */
const R=[
{k:'Establishing wide',t:'Wide',f:'Wide, {s} in the lower third with space ahead',m:'Locked-off, no movement',a:'The scene settles around {s}: ambient motion crosses behind while {s} holds still, setting place and mood.',l:'Use available light; expose for the highlight you want to keep.',e:'Fade in from black over about 10 frames and hold the first beat.'},
{k:'Low-angle detail',t:'Close-up',f:'Low angle, tight on the most distinctive feature of {s}',m:'Slow push-in',a:'The camera sits low and closes in on the key detail of {s}, by movement or by cropping in the edit, with foreground blur leading the eye.',l:'Side-light to carve out shape and texture.',e:'Cut on a sound accent and keep it under 5 seconds.'},
{k:'Side-on pass',t:'Medium',f:'Side profile, {s} centered',m:'Lateral track matching the speed of {s}',a:'Matching the speed of {s}, by moving the camera or by letting {s} travel through a fixed frame, so the background streaks while {s} stays crisp.',l:'Rim or back light separates {s} from the background.',e:'Light speed ramp, or match-cut the move into the next shot.'},
{k:'Texture insert',t:'Macro insert',f:'Extreme close-up, shallow depth of field',m:'Static with subtle drift',a:'A tiny tactile detail of {s} fills the frame while light glints across its surface.',l:'One soft source; flag spill with a dark card.',e:'Use as a cutaway to hide a jump or reset the rhythm.'},
{k:'Point of view',t:'POV',f:'Eye level, from the point of view of {s}',m:'Steady forward move',a:'The viewer sees what {s} sees, moving through the space toward the next point of interest.',l:'Keep practical lights in frame for depth and motion cues.',e:'Cut in on motion so the movement carries across the edit.'},
{k:'Foreground layers',t:'Wide',f:'Framed through foreground elements (railing, glass, foliage)',m:'Slow pan',a:'Foreground elements slide past the lens, revealing {s} behind them in layers.',l:'Keep the foreground darker than {s} to guide the eye.',e:'Use the foreground wipe as a natural transition.'},
{k:'Hero reveal',t:'Medium wide',f:'Centered, symmetrical, slightly low',m:'Slow dolly-out or tilt-up',a:'{s} is fully revealed, clean and intentional, with nothing competing for attention.',l:'Your best light of the shoot: key slightly off-axis, soft fill.',e:'Land the music peak here; make it the longest shot after the opener.'},
{k:'Closing wide',t:'Wide',f:'Wide, {s} shrinking into the environment',m:'Slow pull-back or static hold',a:'The shot releases {s} back into the scene, echoing the opening shot.',l:'Match the opening exposure so the ending rhymes.',e:'Hold one second past the action, then fade to black with the music tail.'},
{k:'Aerial reveal',t:'Aerial wide',f:'High wide angle, {s} small within the landscape',m:'',a:'The drone rises or pulls away slowly, revealing {s} within its surroundings. Fly only where it is legal and safe.',l:'Fly in soft light such as early morning or late afternoon.',e:'Use as an establishing beat and keep it short.'},

const L={Cinematic:'Favor warm practicals against cool ambient light; keep contrast gentle.',Moody:'Underexpose slightly and let shadows fall to black; one hard source only.',Bright:'Shoot with soft, even daylight; avoid harsh midday sun.',Minimal:'Use one clean, soft source and plain surroundings.'};
const MU={Cinematic:'Slow-build ambient synth, 70–90 BPM, with a low hit on the hero reveal.',Moody:'Dark minimal electronica or sparse piano; leave silence before the peak.',Bright:'Upbeat acoustic or light percussion, 100–120 BPM; cut on the beats.',Minimal:'Quiet ambient texture with sparse clicks; let the picture lead.'};
function mkShot(ri,p,dur){const r=R[ri],i=p.input,cp=caps(i),cams=typesOf(i).filter(t=>CAMS.includes(t)&&t!=='Drone'),cam=ri===8?'Drone':ri===9&&cp.has('action')?'Action camera':(cams.length?cams[ri%cams.length]:null),ct=CT[cam]||CT['Other / custom camera'],s=p.subj,rp=x=>x.replace(/\{s\}/g,s);
 return{id:uid(),ri,title:r.k,type:r.t,frame:rp(r.f),move:pickq(MV[ri],cp)[1],act:rp(r.a),light:r.l.replace(/\{s\}/g,s)+' '+L[i.style],tip:((cams.length>1||ri>=8)&&cam?mdl(i,cam)+': ':'')+ct.t[ri%4]+' '+pickq(TP[ri],cp)[1],edit:r.e,dur,done:false}}
/* ---------- My Gear ---------- */
const CAT=[['Cameras',['Smartphone','Mirrorless / DSLR','Cinema camera','DJI Osmo Pocket','Action camera','Drone','360\u00b0 camera','Other / custom camera']],['Stabilization and mounts',['Tripod','Gimbal / stabilizer','Camera slider','Handheld camera rig','Car / suction mount','Other accessories']],['Audio and lighting',['Microphone (type not specified)','Wireless microphone','Shotgun microphone','On-camera microphone','LED lighting','Reflector','ND filters']]];

const fld=(l,h)=>`<div><label class="lbl">${l}</label>${h}</div>`;
const na=t=>`<span class="chip na">${t}</span>`;
const kv=(a,b)=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`;
const frame=(p,i)=>{const[a,b]=p.input.aspect.split(':').map(Number);return `<div class="fc"><div class="frm" style="--r:${(a/b).toFixed(4)}">${i}</div></div>`};
const ARL={'9:16':'Vertical','16:9':'Horizontal','1:1':'Square','4:5':'Portrait'};const dims=p=>{const[a,b]=p.input.aspect.split(':').map(Number),s=+p.exp.res||1080,ev=n=>Math.round(n/2)*2;return a<b?[s,ev(s*b/a)]:[ev(s*a/b),s]};
const stepper=()=>`<div class="steps noprint" role="group" aria-label="Workflow">${[['plan','Plan'],['shoot','Shoot'],['voice','Voiceover'],['subs','Subtitles'],['edit','Edit'],['export','Export']].map((x,i)=>`<button class="${stage===x[0]?'on':''}" data-a="stage" data-t="${x[0]}"><i>${i+1}</i>${x[1]}</button>`).join('')}</div>`;
function shoot(p){const n=p.shots.length,h=p.shots.filter(s=>CL[s.id]).length;
return `<section class="stg"><h3>Shoot</h3><p>Select a clip for each shot to check your coverage. Clips stay in this browser tab only. Nothing is uploaded, and they are cleared when you refresh.</p>${kv('Shots with footage',h+' of '+n)}<div class="bar"><i style="width:${h/n*100}%"></i></div>${grp(p,(s,i)=>{const c=CL[s.id];return `<div class="shot${s.done?' done':''}" data-id="${s.id}"><div class="sh"><input type="checkbox" aria-label="Mark shot ${i+1} filmed" data-c="done" ${s.done?'checked':''}><b>${i+1}</b><div class="ti">${esc(s.title)}</div><span class="chip ${c?'ok':'bad'}">${c?'Footage attached':'Needs footage'}</span><span class="tc">${s.dur}s</span></div><div class="fs"><div class="f"><small>Camera</small><div>${esc(s.type)}. ${esc(s.frame)}. ${esc(s.move)}.</div></div><div class="f"><small>Equipment tip</small><div>${esc(s.tip)}</div></div><div class="f"><small>Lighting</small><div>${esc(s.light)}</div></div></div><div style="margin-top:10px">${s.sc.map((x,j)=>`<label class="ck${x.done?' done':''}"><input type="checkbox" data-c="sc" data-i="${j}" ${x.done?'checked':''}><span>${esc(x.t)}</span></label>`).join('')}</div><div class="row" style="margin-top:12px"><label class="btn sm">${c?'Replace clip':'Select clip'}<input type="file" accept="video/*" data-c="clip" hidden></label>${c?`<span style="color:var(--m)">${esc(c.name)}</span><button class="btn sm" data-a="clipx">Remove clip</button>`:''}</div>${c?`<video class="clip" src="${c.url}" controls playsinline preload="metadata"></video>`:''}</div>`}).join('')}</section>`}
function voice(p){const v=p.vo,w=(v.script.trim().match(/\S+/g)||[]).length,sec=Math.round(w/WPM[v.pace]*60),d=p.input.dur;
return `<section class="stg"><h3>Voiceover</h3><div class="grid g2"><div class="card"><label class="lbl" for="vos">Narration script</label><textarea id="vos" data-c="set" data-k="vo.script" placeholder="Write or paste your narration...">${esc(v.script)}</textarea><div class="row" style="margin-top:10px"><button class="btn sm" data-a="vodraft">Start from shot descriptions</button><span class="chip ${sec>d?'bad':'ok'}">${w} words, about ${dl(sec)} of ${dl(d)}</span></div></div><div class="card"><div class="grid g2">${fld('Language',sel('vo.lang',Object.keys(LC),v.lang))}${fld('Tone',sel('vo.tone',['Calm','Warm','Energetic','Dramatic','Professional'],v.tone))}${fld('Pacing',sel('vo.pace',Object.keys(WPM),v.pace))}${fld('Voice style',sel('vo.voice',['Warm narrator','Deep documentary','Bright presenter','Soft storyteller'],v.voice))}</div><p style="margin-top:12px">Voice style and tone are saved as preferences for a future voice service. Language and pacing drive the timing estimate and the browser preview.</p><div class="row"><button class="btn sm p" data-a="speak" ${v.script.trim()?'':'disabled'}>Preview with browser voice</button><button class="btn sm" data-a="stopspeak">Stop</button></div></div></div><div class="note">ElevenLabs is not connected. Studio AI voices and downloadable audio are unavailable. The preview uses your device’s built-in speech and does not match the chosen voice style.</div></section>`}
function subs(p){const u=p.sub,txt=(p.vo.script.trim()||p.shots[0].act).split(/(?<=[.!?])\s/)[0].slice(0,110),pos={Top:'top:8%',Middle:'top:50%;transform:translateY(-50%)',Bottom:'bottom:8%'}[u.pos];
return `<section class="stg"><h3>Subtitles</h3><div class="grid g2"><div class="card"><span class="lbl">Style preset</span><div class="seg">${Object.keys(SP).map(k=>`<button type="button" class="${u.preset===k?'on':''}" data-a="preset" data-v="${k}">${k}</button>`).join('')}</div><div class="grid g2" style="margin-top:16px">${fld('Font',sel('sub.font',Object.keys(FF),u.font))}${fld('Text colour',`<input type="color" data-c="set" data-k="sub.col" value="${u.col}">`)}</div><div style="margin-top:14px">${fld('Size',`<input type="range" min="30" max="100" value="${u.size}" data-c="set" data-k="sub.size" aria-label="Subtitle size">`)}</div><span class="lbl" style="margin-top:14px">Position</span>${pl('sub.pos',['Top','Middle','Bottom'],u.pos)}<span class="lbl" style="margin-top:14px">Background</span>${pl('sub.bg',['None','Box'],u.bg)}</div><div class="card"><span class="lbl">Preview, ${esc(p.input.aspect)}</span>${frame(p,`<span class="sp" style="${pos};font-family:${FF[u.font]};font-weight:${u.w};font-size:${u.size/10.8}cqw;color:${u.col};${u.bg==='Box'?'background:rgba(0,0,0,.65);padding:.2em .5em;border-radius:.2em':'text-shadow:0 1px 6px #000'}">${esc(txt)}</span>`)}</div></div><div class="note">Automatic transcription and subtitle timing are unavailable. They need a speech-to-text service that is not connected. Style settings are saved with your project.</div></section>`}
function edit(p){const h=p.shots.filter(s=>CL[s.id]).length;
return `<section class="stg"><h3>Edit</h3><p>Reorder shots and choose transitions. Clips play from this browser only.</p><div class="card"><video id="seqv" class="clip" style="margin:0" controls playsinline></video><div class="row" style="margin-top:10px"><button class="btn sm p" data-a="seq" ${h?'':'disabled'}>Play attached clips in order</button><span style="color:var(--m)">${h?'Rough preview: no transitions, narration or music.':'Attach clips in Shoot to preview.'}</span></div></div>${strip(p.shots)}${grp(p,(s,i)=>{const c=CL[s.id];return `<div class="shot" data-id="${s.id}"><div class="sh"><b>${i+1}</b><div class="ti">${esc(s.title)}</div><span class="chip ${c?'ok':'bad'}">${c?'Clip attached':'No clip'}</span><span class="tc">${s.dur}s</span><span class="row" style="gap:4px"><button class="btn sm" data-a="up" aria-label="Move up">↑</button><button class="btn sm" data-a="dn" aria-label="Move down">↓</button></span></div>${c?`<video class="clip" src="${c.url}" controls playsinline preload="metadata"></video>`:'<div class="ph">No footage yet</div>'}<div style="margin-top:10px"><label class="lbl">Transition into next shot</label><select data-c="tr">${TR.map(x=>`<option${x===s.tr?' selected':''}>${x}</option>`).join('')}</select></div></div>`}).join('')}<div class="tl2"><span>Narration track</span>${na('Future integration')}</div><div class="tl2"><span>Music track</span>${na('Future integration')}</div><div class="note">Transitions are saved in your plan for a future render. They are not applied in this preview.</div></section>`}
function expo(p){const[w,h]=dims(p),wc=(p.vo.script.match(/\S+/g)||[]).length;
return `<section class="stg"><h3>Export</h3><div class="grid g2"><div class="card"><label class="lbl">Resolution</label><select data-c="set" data-k="exp.res">${[['720','720p'],['1080','1080p'],['2160','4K']].map(x=>`<option value="${x[0]}"${x[0]===p.exp.res?' selected':''}>${x[1]}</option>`).join('')}</select><div style="margin-top:14px">${kv('Aspect ratio',esc(p.input.aspect)+(ARL[p.input.aspect]?' · '+ARL[p.input.aspect]:''))}${kv('Output size (width × height)',w+' × '+h+' px')}${kv('Target platform',esc(p.input.platform))}${kv('Runtime',fmt(total(p)))}${kv('Shots with footage',p.shots.filter(s=>CL[s.id]).length+' of '+p.shots.length)}${kv('Narration script',wc?wc+' words':'None')}${kv('Subtitle style',esc(p.sub.preset))}</div></div><div class="card"><h3>Available now</h3><p>Take your plan with you.</p><div class="row"><button class="btn" data-a="print">Print / save PDF plan</button><button class="btn" data-a="copy">Copy plan as text</button></div><h3 style="margin-top:22px">Video file</h3><button class="btn" disabled>Render MP4 (unavailable)</button></div></div><div class="note">Final MP4 rendering needs a backend video renderer that has not been built. Nothing on this page creates a video file. Resolution means the shorter side of the frame: 1080p is 1080 px, so 9:16 gives 1080 × 1920 and 16:9 gives 1920 × 1080. These settings are for planning only.</div></section>`}
const stageView=p=>({shoot,voice,subs,edit,export:expo}[stage]||shoot)(p);
const V={home,studio,project,projects,pricing};
function render(keep){document.body.dataset.stage=stage;const h=(location.hash||'#home').slice(1);const k=V[h]?h:'home';$('#v').innerHTML=V[k]();document.querySelectorAll('nav a[data-n]').forEach(a=>a.classList.toggle('on',a.dataset.n===k));if(!keep)window.scrollTo(0,0)}
addEventListener('hashchange',()=>render());

/* ---------- Actions ---------- */
const go=h=>{location.hash=h};
function readForm(){const cs=Math.round((+$('#durc').value||0)*(+$('#duru').value||60));return{idea:$('#idea').value.trim(),dur:cs>=5&&cs<=10800?cs:+$('#dur').value,aspect:$('#aspect').value,style:$('#style').value,gearText:$('#eqt').value.trim(),platform:$('#platform').value,exp:$('#exp').value,dialogue:$('#dlg').value==='1',loc:$('#loc').value.trim(),notes:$('#notes').value.trim(),adv:$('.adv').open}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.a,card=b.closest('[data-id]'),id=card&&card.dataset.id,p=P();
 if(a==='gen'){const i=readForm();draft=i;if(i.idea.length<10){toast('Describe your idea in a sentence or two first.');$('#idea').focus();return}{const cs=Math.round((+$('#durc').value||0)*(+$('#duru').value||60));if($('#durc').value&&(cs<5||cs>10800)){toast('Custom duration must be between 5 seconds and 3 hours.');return}}
  if(S.used>=PLANS[0].gens){toast('You have used all 3 free plans this month. Paid plans are not available yet.');return}
  busy=true;render(1);setTimeout(()=>{const np=gen(i);S.projects.push(np);S.used++;save();busy=false;curId=np.id;tab='shots';stage='plan';gedit=false;go('project');render()},900)}
 else if(a==='tab'){tab=b.dataset.t;render(1)}
 else if(a==='open'){curId=id;tab='shots';stage='plan';gedit=false;go('project')}
 else if(a==='dup'){const o=S.projects.find(x=>x.id===id),c=JSON.parse(JSON.stringify(o));c.id=uid();c.title=o.title+' (copy)';c.created=Date.now();c.shots.forEach(s=>s.id=uid());S.projects.push(c);save();render(1);toast('Project duplicated.')}
 else if(a==='del'){delArm=id;render(1)}
 else if(a==='delno'){delArm=null;render(1)}
 else if(a==='delyes'){S.projects=S.projects.filter(x=>x.id!==id);if(curId===id)curId=null;delArm=null;save();render(1);toast('Project deleted.')}
 else if(a==='gsave'){const t=$('#eqt').value.trim();if(!t){toast('Type your equipment first.');return}S.gear={text:t.slice(0,400)};save();draft=readForm();render(1);toast('Equipment saved in this browser.')}
 else if(a==='guse'){draft=readForm();draft.gearText=gearTextOf(S.gear);render(1)}
 else if(a==='gclr'){S.gear=null;save();draft=readForm();render(1);toast('Saved equipment cleared.')}
 else if(a==='gedit'){gedit=!gedit;gtmp=gedit&&p?{text:p.input.gearText!=null?p.input.gearText:legacyText(p.input)}:null;render(1)}
 else if(a==='gapply'){const t=$('#gpt').value.trim().slice(0,400);p.input.gearText=t;p.input.gearOnly=true;applyGear(p.input,true);regear(p);gedit=false;gtmp=null;save();render(1);toast('Equipment updated for this project.')}
 else if(a==='pick'){const k=b.dataset.k,v=b.dataset.v;draft=readForm();if(k==='dlg')draft.dialogue=v==='1';else draft[k]=k==='dur'?+v:v;render(1)}
 else if(a==='insp'){draft=readForm();draft.idea=INSP[+b.dataset.i].p;render(1);const x=$('#idea');x.focus();x.setSelectionRange(x.value.length,x.value.length)}
 else if(a==='buy')toast('Billing isn’t set up yet. No payment was taken.');
 else if(p){const i=p.shots.findIndex(s=>s.id===id),s=p.shots[i];
  if(a==='up'&&i>0){s.scn=p.shots[i-1].scn;[p.shots[i-1],p.shots[i]]=[p.shots[i],p.shots[i-1]]}
  else if(a==='dn'&&i<p.shots.length-1){s.scn=p.shots[i+1].scn;[p.shots[i+1],p.shots[i]]=[p.shots[i],p.shots[i+1]]}
  else if(a==='rm'){if(p.shots.length<2){toast('A plan needs at least one shot.');return}p.shots.splice(i,1)}
  else if(a==='rg'){const used=p.shots.map(x=>x.ri),free=av(p).filter(k=>!used.includes(k)),pool=free.length?free:av(p).filter(k=>k!==s.ri);const n=mkShot(pool[Math.floor(Math.random()*pool.length)],p,s.dur);n.id=s.id;n.scn=s.scn;n.tr=s.tr;p.shots[i]=n;toast('Shot regenerated (simulated).')}
  else if(a==='add'){const sc=b.dataset.sc||p.scenes[p.scenes.length-1].id,n=mkShot(av(p)[Math.floor(Math.random()*av(p).length)],p,3);n.scn=sc;let at=-1;p.shots.forEach((x,k)=>{if(x.scn===sc)at=k});p.shots.splice(at<0?p.shots.length:at+1,0,n)}
  else if(a==='fix'){fix(p)}
  else if(a==='tg'){const q=p.scenes.find(x=>x.id===b.dataset.sc);OPEN[p.id+q.id]=!isOpen(p,q)}
  else if(a==='stage'){stage=b.dataset.t;window.scrollTo(0,0)}
  else if(a==='set'){const[o,k]=b.dataset.k.split('.');p[o][k]=b.dataset.v}
  else if(a==='preset'){Object.assign(p.sub,SP[b.dataset.v],{preset:b.dataset.v})}
  else if(a==='vodraft'){p.vo.script=p.shots.map(x=>x.act).join('\n\n')}
  else if(a==='clipx'){if(CL[id]){URL.revokeObjectURL(CL[id].url);delete CL[id]}}
  else if(a==='speak'){if(!('speechSynthesis' in window)){toast('This browser has no built-in speech.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(p.vo.script);u.rate={Slow:.85,Normal:1,Fast:1.2}[p.vo.pace];u.lang=LC[p.vo.lang];speechSynthesis.speak(u);return}
  else if(a==='stopspeak'){if('speechSynthesis' in window)speechSynthesis.cancel();return}
  else if(a==='seq'){const q=p.shots.filter(x=>CL[x.id]).map(x=>CL[x.id].url),v=$('#seqv');let k=0;const nx=()=>{if(k<q.length){v.src=q[k++];v.play().catch(()=>{})}};v.onended=nx;nx();return}
  else if(a==='print'){stage='plan';p.scenes.forEach(x=>OPEN[p.id+x.id]=true);render(1);window.print();return}
  else if(a==='copy'){const t=asText(p);const fb=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast('Plan copied.')}catch(e){toast('Copy was blocked by the browser.')}x.remove()};try{navigator.clipboard.writeText(t).then(()=>toast('Plan copied.'),fb)}catch(e){fb()}return}
  save();render(1)}});
document.addEventListener('change',e=>{const el=e.target,c=el.dataset.c;if(!c)return;if(c==='dsel'){$('#durc').value='';draft=readForm();render(1);return}if(c==='dcus'){draft=readForm();const sd=$('.side');if(sd)sd.outerHTML=side(draft);return}const p=P(),card=el.closest('[data-id]'),id=card&&card.dataset.id;
 if(c==='rn'){const x=S.projects.find(q=>q.id===id);x.title=el.value.trim()||x.title;save();toast('Renamed.');return}
 if(!p)return;
 if(c==='set'){const[o,k]=el.dataset.k.split('.');p[o][k]=el.type==='range'?+el.value:el.value;if(el.tagName==='TEXTAREA'){save();return}}else if(c==='tr'){p.shots.find(x=>x.id===id).tr=el.value}else if(c==='ck'){p.check[+el.dataset.i].done=el.checked}
 else{const s=p.shots.find(x=>x.id===id);if(c==='done')s.done=el.checked;if(c==='sc')s.sc[+el.dataset.i].done=el.checked;if(c==='clip'&&el.files[0]){if(CL[id])URL.revokeObjectURL(CL[id].url);CL[id]={url:URL.createObjectURL(el.files[0]),name:el.files[0].name}}if(c==='dur')s.dur=Math.max(1,Math.min(10800,Math.round(+el.value)||1))}
 save();render(1)});
document.addEventListener('focusout',e=>{const el=e.target;if(!el.dataset||!el.dataset.f)return;const p=P();if(!p)return;const v=el.innerText.trim();
 if(el.dataset.f==='ptitle'){p.title=v||p.title}else{const s=p.shots.find(x=>x.id===el.closest('[data-id]').dataset.id);if(s)s[el.dataset.f]=v}save()});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='idea'||el.id==='eqt'){const d=$('#det');if(d)d.textContent=detText(parseGear($('#idea').value,$('#eqt').value))}else if(el.id==='gpt'){if(gtmp)gtmp.text=el.value;const d=$('#gpd');if(d)d.textContent=detText(parseGear('',el.value))}});
render();
</script></body></html>
